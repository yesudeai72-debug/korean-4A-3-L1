<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>서울대 한국어 4A · 듣기 1</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');:root{--bg:#f3f6f8;--paper:#fff;--ink:#182c3a;--muted:#61717c;--line:#d6e0e5;--blue:#126b86;--blue-dark:#084a63;--pale:#e7f4f7;--correct:#198754;--correct-bg:#e4f5ea;--wrong:#c4513a;--wrong-bg:#fff0eb;--shadow:0 12px 30px rgba(18,66,85,.1)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef7f9,#f7f4ed);color:var(--ink);font-family:'Noto Sans KR',sans-serif;padding:28px 16px 56px}main{max-width:820px;margin:auto}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px}.meta{font:700 12px 'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--blue);display:flex;gap:9px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--pale)}h1{font:700 30px/1.3 'Gowun Batang',serif;margin:9px 0 8px}.guide{margin:0;color:var(--muted);font-size:15px;line-height:1.7}.player{margin:21px 0 18px;padding:17px 0;border-block:1px solid var(--line)}.player-top{display:flex;gap:12px;align-items:center}.play{border:0;background:var(--blue);color:white;border-radius:50%;width:46px;height:46px;font-size:17px;cursor:pointer}.seek{flex:1;accent-color:var(--blue);cursor:pointer}.time{font:500 12px 'JetBrains Mono',monospace;color:var(--muted);white-space:nowrap}.player-bottom,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,select{font:600 14px 'Noto Sans KR',sans-serif;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}button:hover,select:hover{border-color:var(--blue)}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.score{margin-left:auto;align-self:center;color:var(--muted);font:700 13px 'JetBrains Mono',monospace}.score b{color:var(--blue-dark);font-size:16px}.transcript{margin-top:20px;display:grid;gap:12px}.line{display:grid;grid-template-columns:128px 1fr;gap:14px;align-items:start}.speaker{font-weight:700;color:var(--blue-dark);padding:12px 4px}.speech{background:#f8fbfc;border:1px solid #e0eaee;border-radius:4px 15px 15px 15px;padding:11px 15px;font-size:17px;line-height:2.05}.line:nth-child(even) .speech{background:#fcfaf6;border-color:#ece4d8}.blank{font:600 16px 'Noto Sans KR',sans-serif;text-align:center;width:8ch;min-width:72px;border:0;border-bottom:2px solid var(--blue);border-radius:4px 4px 0 0;padding:1px 4px;background:#fff;color:var(--ink)}.blank.long{width:12ch}.blank.xlong{width:15ch}.blank.correct{border-color:var(--correct);background:var(--correct-bg);color:var(--correct)}.blank.wrong{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong)}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}@media(max-width:600px){body{padding:14px 10px 36px}.card{padding:20px 16px}h1{font-size:25px}.line{grid-template-columns:1fr;gap:1px}.speaker{padding:3px 6px}.speech{font-size:16px;padding:10px 13px}.time{font-size:11px}.score{margin-left:0}.blank{font-size:15px}}</style></head>
<body><main><section class="card"><div class="meta"><span class="dot"></span>서울대 한국어 4A · 듣기 1 · TRACK 28 · P.76</div><h1>결과와 과정</h1><p class="guide">음원을 들으며 빈칸에 알맞은 어휘나 표현을 입력하세요. 모든 빈칸을 입력해야 정답 보기를 사용할 수 있습니다. 필요한 경우 0.5배속까지 천천히 들을 수 있습니다.</p><audio id="audio" src="track28.mp3" preload="metadata"></audio><div class="player"><div class="player-top"><button class="play" id="play" aria-label="재생">▶</button><input class="seek" id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="재생 위치"><span class="time" id="time">00:00 / 00:00</span></div><div class="player-bottom"><button id="back">⏪ 5초</button><button id="forward">5초 ⏩</button><select id="speed" aria-label="재생 속도"><option value="0.5">0.5x</option><option value="0.6">0.6x</option><option value="0.75">0.75x</option><option value="1" selected>1.0x</option></select></div></div><div class="actions"><button class="primary" id="check">정답 확인</button><button id="reveal" disabled title="모든 빈칸을 입력하면 사용할 수 있습니다">정답 보기</button><button id="reset">↺ 다시 하기</button><span class="score">맞은 개수 <b id="score">0</b>/14</span></div></section><section class="transcript" id="transcript" aria-label="듣기 대본"></section><footer>듣기 1 · Seoul National University Korean 4A</footer></main>
<script>
const lines=[['사회자',['','최근',' 올림픽 경기에서 은메달을 딴 선수가 시상대에서 1등을 못 해서 ','억울하다고',' 한 일에 대해 말들이 많습니다. 이 일에 대해서 ','어떻게',' 생각하십니까?']],['해설 위원 1',['네, 저는 그 선수의 마음이 ','충분히',' 이해가 됩니다. 그 한 경기를 위해서 노력해 온 시간을 생각해 보십시오. ','마지막 순간','에 다른 선수와 ','부딪히는 바람에',' ','아깝게',' 1등을 놓쳤으니 억울하지 않겠습니까?']],['해설 위원 2',['저는 그런 ','행동','이 이해가 되지 않습니다. 2등도 ','훌륭한',' 결과입니다. 최선을 다해서 열심히 준비했고 그 결과로 은메달을 받았으면 결과를 ','받아들여야',' 한다고 생각합니다. 1등을 하지 못했다고 해서 억울해하는 것은 ','바람직한',' 스포츠 정신이 아닙니다.']],['해설 위원 1',['물론 운동 경기에서 ','연습 과정','도 중요하지만 결국 결과가 중요한 것 아닙니까? 1등과 2등은 분명한 차이가 있습니다. 사람들은 1등만을 기억하기 때문에 운동선수에게 은메달은 ','받으나 마나','입니다.']],['해설 위원 2',['아니, 그럼 ','반칙','을 해서라도 1등을 해야 한다는 겁니까? 스포츠는 결과뿐만 아니라 과정도 중요합니다.']]];
const answers=['최근','억울하다고','어떻게','충분히','마지막 순간','부딪히는 바람에','아깝게','행동','훌륭한','받아들여야','바람직한','연습 과정','받으나 마나','반칙'], widths={'마지막 순간':'long','부딪히는 바람에':'xlong','받아들여야':'long','바람직한':'long','연습 과정':'long','받으나 마나':'long','억울하다고':'long'};let n=0;const transcript=document.querySelector('#transcript');for(const [speaker,parts]of lines){const row=document.createElement('div'),label=document.createElement('div'),speech=document.createElement('div');row.className='line';label.className='speaker';speech.className='speech';label.textContent=speaker;for(const p of parts){if(answers.includes(p)){n++;const input=document.createElement('input');input.className='blank '+(widths[p]||'');input.dataset.answer=p;input.autocomplete='off';input.setAttribute('aria-label',`${n}번 빈칸`);speech.append(input)}else speech.append(document.createTextNode(p))}row.append(label,speech);transcript.append(row)}
const audio=document.querySelector('#audio'),play=document.querySelector('#play'),seek=document.querySelector('#seek'),time=document.querySelector('#time'),speed=document.querySelector('#speed'),fmt=s=>{s=Math.floor(s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};audio.addEventListener('loadedmetadata',()=>{seek.max=audio.duration;time.textContent=`00:00 / ${fmt(audio.duration)}`});audio.addEventListener('timeupdate',()=>{seek.value=audio.currentTime;time.textContent=`${fmt(audio.currentTime)} / ${fmt(audio.duration)}`});audio.addEventListener('play',()=>play.textContent='⏸');audio.addEventListener('pause',()=>play.textContent='▶');play.onclick=()=>audio.paused?audio.play():audio.pause();seek.oninput=()=>audio.currentTime=seek.value;document.querySelector('#back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-5);document.querySelector('#forward').onclick=()=>audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+5);speed.onchange=()=>audio.playbackRate=Number(speed.value);
const inputs=()=>[...document.querySelectorAll('.blank')],reveal=document.querySelector('#reveal');const updateRevealAvailability=()=>{reveal.disabled=!inputs().every(i=>i.value.trim())};inputs().forEach(i=>i.addEventListener('input',updateRevealAvailability));document.querySelector('#check').onclick=()=>{let correct=0;inputs().forEach(i=>{const value=i.value.trim();i.classList.remove('correct','wrong');if(!value)return;const ok=value===i.dataset.answer;i.classList.add(ok?'correct':'wrong');if(ok)correct++});document.querySelector('#score').textContent=correct};reveal.onclick=()=>{inputs().forEach(i=>{i.value=i.dataset.answer;i.classList.remove('wrong');i.classList.add('correct')});document.querySelector('#score').textContent=14};document.querySelector('#reset').onclick=()=>{inputs().forEach(i=>{i.value='';i.classList.remove('correct','wrong')});document.querySelector('#score').textContent=0;updateRevealAvailability()};
</script></body></html>
